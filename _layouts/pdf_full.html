<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <title>{{ page.title }}</title>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <link rel="stylesheet" href="{{ "/assets/css/style.css" | relative_url }}">
  <style>
    body,html{margin:0;padding:0;height:100%;background:#f5f5f5;}
    .pdf-container{max-width:1400px;margin:0 auto;padding:0 0 20px;}
    .pdf-header{padding:16px 18px 8px;}
    .pdf-header h1{margin:0 0 6px;font-size:1.4rem;}
    .pdf-header .meta{color:#666;font-size:.85rem;margin-bottom:10px;}
    .pdf-wrap iframe,
    .pdf-wrap object{display:block;border:0;width:100%;height:calc(100vh - 140px);}
    .fallback{padding:1rem;font-size:.9rem;}
    .back-home{position:fixed;top:10px;right:10px;font-size:.75rem;background:#fff;padding:.4rem .6rem;border:1px solid #ccc;text-decoration:none;}
  </style>
</head>
<body>
  <a class="back-home" href="{{ "/" | relative_url }}">首页</a>
  <div class="pdf-container">
    <div class="pdf-header">
      <h1>{{ page.title }}</h1>
      {% if page.abstract %}
        <div class="meta">{{ page.abstract }}</div>
      {% endif %}
    </div>
    <div class="pdf-wrap">
      {{ content }}
    </div>
  </div>
</body>
</html>
